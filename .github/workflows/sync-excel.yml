name: Sincronizar Excel de Google Drive

on:
  repository_dispatch:
    types: [glide_sync]
  schedule:
    # Respaldo automático
    - cron: '0 0,2,3,5,7,8,10,12,13,15,17,18,20,22,23 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub

jobs:
  sync-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install xlsx

      - name: Descargar y procesar Excel
        env:
          DRIVE_FOLDER_ID: '1FBlEYxCM8HrI9AAh_cLISbIgb8cCbbsT'
        run: node scripts/update-excel.js

      - name: Hacer commit y push si hay cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Sincronización automática de data.json desde Google Drive"
          file_pattern: "data.json"
